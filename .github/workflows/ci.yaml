name: CI

on:
  workflow_call:
    outputs:
      matrix:
        description: Architecture and runner matrix for dependent jobs
        value: ${{ jobs.prepare-integration.outputs.matrix }}
  pull_request:

jobs:
  ci:
    uses: canonical/hpc-team/.github/workflows/charmed-hpc-ci.yaml@main
    with:
      setup-commands: sudo snap install astral-uv --classic
      run-test: false

  unit-test:
    name: Unit tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: canonical/hpc-team/.github/actions/setup-just@main
      - name: Install uv
        run: sudo snap install astral-uv --classic
      - run: just unit

  prepare-integration:
    name: Prepare integration matrix
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: matrix
        uses: ./.github/actions/architecture-matrix

  integration-tests:
    name: Integration tests (${{ matrix.machine-type }})
    strategy:
      fail-fast: false
      matrix: >-
        ${{ fromJSON(needs.prepare-integration.outputs.matrix) }}
    needs:
      - ci
      - unit-test
      - prepare-integration
    runs-on: ${{ matrix.machine-type }}
    steps:
      - uses: actions/checkout@v7
      - uses: canonical/hpc-team/.github/actions/setup-just@main
      - name: Install uv
        run: sudo snap install astral-uv --classic
      - name: Install charmcraft
        run: sudo snap install charmcraft --classic
      - name: Setup operator environment
        uses: charmed-kubernetes/actions-operator@main
        with:
          provider: lxd
          lxd-channel: 5.21/stable
          juju-channel: 3.6/stable
      - run: just integration
