name: Charmcraft architecture matrix
description: >-
  Map the architectures supported by the charm
  to GitHub runner labels

inputs:
  charmcraft-file:
    description: Path to the Charmcraft project file
    required: false
    default: charmcraft.yaml
  runners:
    description: JSON object mapping architecture names to GitHub runner labels
    required: false
    default: >-
      {"amd64":"ubuntu-26.04","arm64":"ubuntu-26.04-arm"}

outputs:
  matrix:
    description: JSON matrix object with architecture and machine-type entries
    value: ${{ steps.matrix.outputs.matrix }}

runs:
  using: composite
  steps:
    - name: Install uv
      shell: bash
      run: sudo snap install astral-uv --classic

    - id: matrix
      shell: bash
      env:
        CHARMCRAFT_FILE: ${{ inputs.charmcraft-file }}
        RUNNERS_JSON: ${{ inputs.runners }}
      run: uv run "${{ github.action_path }}/main.py"
